<script>
	// Keep the layout's top offset (body padding, section scroll-margin) in
	// exact sync with the real, rendered height of the fixed navbar — the
	// navbar's height changes with the logo size, font loading, and viewport
	// width, so a hardcoded pixel value drifts out of sync and either leaves
	// a gap or lets the navbar overlap content.
	const topBar = document.querySelector('.top-bar');
	function syncNavbarHeight(){
		const h = Math.round(topBar.getBoundingClientRect().height);
		document.documentElement.style.setProperty('--navbar-h', h + 'px');
	}
	syncNavbarHeight();
	window.addEventListener('load', syncNavbarHeight);
	window.addEventListener('resize', syncNavbarHeight);
	const navLogo = document.querySelector('.top-bar .logo');
	if (navLogo && !navLogo.complete) {
		navLogo.addEventListener('load', syncNavbarHeight);
	}
	if (document.fonts && document.fonts.ready) {
		document.fonts.ready.then(syncNavbarHeight);
	}

	const hamburger = document.getElementById('hamburger');
	const navbar = document.querySelector('.navbar');
	const mobileSocials = document.getElementById('mobileSocials');

	hamburger.addEventListener('click', () => {
		navbar.classList.toggle('active');
		hamburger.classList.toggle('active');
		mobileSocials.classList.toggle('active');
		document.body.classList.toggle('no-scroll');
	});

	document.querySelectorAll('.navbar ul a').forEach(link => {
		link.addEventListener('click', () => {
			navbar.classList.remove('active');
			hamburger.classList.remove('active');
			mobileSocials.classList.remove('active');
			document.body.classList.remove('no-scroll');
		});
	});
</script>
